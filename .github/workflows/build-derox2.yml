name: Build DEROX OS 2.0 Assets & Scripts

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project structure and permissions
        run: |
          test -f grub-theme-derox2/theme.txt
          test -f grub-theme-derox2/install.sh
          test -f scripts/build-rootfs.sh
          test -f scripts/build-iso.sh
          chmod +x grub-theme-derox2/install.sh scripts/*.sh

      - name: Syntax check shell scripts
        run: |
          bash -n grub-theme-derox2/install.sh
          bash -n scripts/build-rootfs.sh
          bash -n scripts/build-iso.sh

      - name: Package DEROX 2.0 Release Bundle
        run: |
          mkdir -p dist
          tar -czvf dist/derox-os-2.0-dev-bundle.tar.gz grub-theme-derox2/ scripts/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: derox-2.0-dev-bundle
          path: dist/derox-os-2.0-dev-bundle.tar.gz
