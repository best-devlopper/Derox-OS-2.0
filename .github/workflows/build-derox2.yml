name: Build DEROX OS 2.0 ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc wget curl busybox-static cpio gzip grub-pc-bin grub-efi-amd64-bin xorriso mtools

      - name: Normalize line endings and permissions
        run: |
          sed -i 's/\r$//' grub-theme-derox2/install.sh scripts/*.sh
          chmod +x grub-theme-derox2/install.sh scripts/*.sh

      - name: Build DEROX 2.0 RootFS
        run: |
          bash ./scripts/build-rootfs.sh

      - name: Build Linux Kernel & Bootable ISO
        run: |
          bash ./scripts/build-iso.sh

      - name: Upload DEROX OS 2.0 ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: derox-os-2.0-iso
          path: dist/derox-os-2.0-x86_64.iso
